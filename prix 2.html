<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172b4d">
<title>Pokéfolio – Ma collection et la valeur de mes cartes</title>
<style>
:root{
  --navy:#172b4d;--bg:#eef1f6;--card:#fff;--text:#18212f;--muted:#5f6b7d;
  --line:#dbe1ea;--gold:#f2b705;--red:#d93a4a;--tag:#fff7d6;--tagtext:#5a4300;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0c1118;--card:#151c27;--text:#e8edf5;--muted:#93a0b4;--line:#263042;--tag:#3a3008;--tagtext:#ffe08a;--red:#ff6b78
}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 16px 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:22px}
.total{text-align:right}
.total b{display:block;font-size:30px;line-height:1.05;color:var(--gold);font-weight:800}
.total small{color:#c4d0e4;font-size:13px}
nav{display:flex;gap:6px;max-width:760px;margin:0 auto;padding:12px 16px 0}
nav button{flex:1;padding:11px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--text);border-bottom-color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:14px 16px 90px}
.bar{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
button{font:inherit}
.btn{padding:11px 16px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.55}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{color:var(--muted);font-size:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item img,.item .noimg{width:100%;aspect-ratio:5/7;object-fit:contain;border-radius:6px;background:var(--bg)}
.item .nm{font-weight:700;font-size:15px;line-height:1.2}
.item .st{color:var(--muted);font-size:13px}
.price{align-self:flex-start;border:0;border-radius:8px;padding:5px 10px;background:var(--tag);color:var(--tagtext);font-weight:800;cursor:pointer}
.price.none{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-weight:600}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.qty{display:flex;align-items:center;gap:8px}
.qty button,.del{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:18px;cursor:pointer}
.del{color:var(--red);font-size:15px}
.add{width:100%}
#more{margin-top:14px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
footer{max-width:760px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Pokéfolio</h1>
    <div class="total"><b id="tv">0,00 €</b><small id="tc">0 carte</small></div>
  </div>
</header>
<nav>
  <button id="t1" class="on" type="button">Ma collection</button>
  <button id="t2" type="button">Ajouter des cartes</button>
</nav>
<main>
  <section id="v1"></section>
  <section id="v2" hidden>
    <div class="bar">
      <input id="q" type="search" placeholder="Nom de la carte, ex. Dracaufeu" enterkeyhint="search" autocomplete="off">
      <button class="btn" id="go" type="button">Chercher</button>
    </div>
    <p class="hint">Tapez le nom en français (Dracaufeu, Pikachu, Mewtwo…), au moins 3 lettres.</p>
    <div id="res"></div>
  </section>
</main>
<footer>
  Cartes et images : TCGdex. Prix indicatifs : tendance Cardmarket en euros, sinon prix du marché TCGplayer en dollars, mis à jour chaque jour. Votre collection reste enregistrée sur cet appareil.
</footer>
<div id="toast" role="status"></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var KEY='pokefolio_v2',B='https://api.tcgdex.net/v2/',PAGE=20;
  var col=[],all=[],shown=0,cache={},tt;
  try{col=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){col=[]}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(col))}catch(e){}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function money(v,c){if(v==null)return '—';try{return new Intl.NumberFormat('fr-FR',{style:'currency',currency:c||'EUR'}).format(v)}catch(e){return v+' '+c}}
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1800)}

  function j(url){
    var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},20000);
    return fetch(url,{signal:ctl.signal}).then(function(r){
      clearTimeout(to);if(!r.ok)throw new Error(r.status);return r.json();
    },function(e){clearTimeout(to);throw e});
  }
  function pool(items,n,fn){
    var i=0;
    function next(){
      if(i>=items.length)return Promise.resolve();
      var k=i++;
      return Promise.resolve().then(function(){return fn(items[k],k)}).catch(function(){}).then(next);
    }
    var w=[];for(var s=0;s<Math.min(n,items.length);s++)w.push(next());
    return Promise.all(w);
  }

  function price(d){
    var p=d&&d.pricing;if(!p)return null;
    var m=p.cardmarket;
    if(m){var v=m.trend||m.avg||m['trend-holo']||m['avg-holo'];if(v)return{v:v,c:'EUR'}}
    var t=p.tcgplayer;
    if(t){for(var k in t){var o=t[k];if(o&&typeof o==='object'){var u=o.marketPrice||o.midPrice;if(u)return{v:u,c:'USD'}}}}
    return null;
  }
  function detail(id){
    if(cache[id])return Promise.resolve(cache[id]);
    var e=encodeURIComponent(id);
    return j(B+'fr/cards/'+e).catch(function(){return null}).then(function(d){
      if(d&&price(d))return d;
      return j(B+'en/cards/'+e).catch(function(){return null}).then(function(en){
        if(!d)return en;
        if(en&&en.pricing)d.pricing=en.pricing;
        return d;
      });
    }).then(function(d){if(d)cache[id]=d;return d});
  }
  function imgOf(c){return c.image?c.image+'/low.webp':''}

  function show(n){
    $('#v1').hidden=n!==1;$('#v2').hidden=n!==2;
    $('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2);
    if(n===2)$('#q').focus();
  }
  $('#t1').onclick=function(){show(1)};
  $('#t2').onclick=function(){show(2)};

  function renderCol(){
    var sums={},n=0;
    col.forEach(function(x){n+=x.qty;if(x.price!=null)sums[x.cur]=(sums[x.cur]||0)+x.price*x.qty});
    var keys=Object.keys(sums);
    $('#tv').textContent=keys.length?keys.map(function(k){return money(sums[k],k)}).join(' + '):money(0,'EUR');
    $('#tc').textContent=n+(n>1?' cartes':' carte');
    var v=$('#v1');
    if(!col.length){
      v.innerHTML='<div class="empty"><b>Votre classeur est vide</b>Cherchez une carte dans l’onglet « Ajouter des cartes » pour la voir ici avec sa valeur.</div>';
      return;
    }
    v.innerHTML='<div class="row"><button class="btn alt" id="rf" type="button">Actualiser les prix</button><span class="hint" id="rs" style="margin:0"></span></div><div class="grid">'+
      col.map(function(x,i){
        var p=x.price!=null
          ?'<button class="price" data-a="price" data-i="'+i+'" type="button" title="Modifier le prix">'+money(x.price,x.cur)+(x.qty>1?' × '+x.qty:'')+'</button>'
          :'<button class="price none" data-a="price" data-i="'+i+'" type="button">Saisir le prix</button>';
        return '<article class="item">'+(x.img?'<img src="'+esc(x.img)+'" alt="'+esc(x.name)+'" loading="lazy">':'<div class="noimg"></div>')+
          '<div><div class="nm">'+esc(x.name)+'</div><div class="st">'+esc(x.set)+(x.num?' · n° '+esc(x.num):'')+'</div></div>'+p+
          '<div class="ctrl"><div class="qty"><button data-a="minus" data-i="'+i+'" type="button" aria-label="Retirer un exemplaire">−</button><b>'+x.qty+'</b><button data-a="plus" data-i="'+i+'" type="button" aria-label="Ajouter un exemplaire">+</button></div>'+
          '<button class="del" data-a="del" data-i="'+i+'" type="button" aria-label="Supprimer la carte">✕</button></div></article>';
      }).join('')+'</div>';
  }

  $('#v1').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='rf'){refresh();return}
    var i=+b.dataset.i,x=col[i],a=b.dataset.a;if(!x)return;
    if(a==='plus')x.qty++;
    else if(a==='minus'){x.qty--;if(x.qty<1){if(confirm('Retirer « '+x.name+' » de la collection ?'))col.splice(i,1);else x.qty=1}}
    else if(a==='del'){if(confirm('Retirer « '+x.name+' » de la collection ?'))col.splice(i,1)}
    else if(a==='price'){
      var r=prompt('Prix d’une carte « '+x.name+' » (en €) :',x.price!=null&&x.cur==='EUR'?x.price:'');
      if(r===null)return;
      var n=parseFloat(String(r).replace(',','.'));
      if(isNaN(n)||n<0){toast('Prix non valide');return}
      x.price=n;x.cur='EUR';x.manual=true;
    }
    save();renderCol();
  });

  function refresh(){
    var btn=$('#rf'),st=$('#rs');btn.disabled=true;
    var list=col.filter(function(x){return !x.manual}),done=0,ok=0;
    st.textContent='Mise à jour…';
    pool(list,5,function(x){
      delete cache[x.id];
      return detail(x.id).then(function(d){
        var p=price(d);if(p){x.price=p.v;x.cur=p.c;ok++}
        if(d&&d.set&&!x.set)x.set=d.set.name;
        done++;st.textContent='Mise à jour… '+done+'/'+list.length;
      });
    }).then(function(){
      save();renderCol();
      var s=$('#rs');
      if(s)s.textContent=(ok||!list.length)?ok+' prix mis à jour sur '+list.length+'.':'Service de prix injoignable. Vérifiez votre connexion et réessayez.';
    });
  }

  function search(){
    var t=$('#q').value.trim().replace(/[&?#]/g,'');
    if(t.length<3){toast('Tapez au moins 3 lettres');return}
    var r=$('#res');r.innerHTML='<p class="hint">Recherche en cours…</p>';
    j(B+'fr/cards?name='+encodeURIComponent(t)).then(function(d){
      if(d.length)return d;
      return j(B+'en/cards?name='+encodeURIComponent(t));
    }).then(function(d){
      all=d;shown=0;
      if(!all.length){r.innerHTML='<p class="hint">Aucune carte trouvée pour « '+esc(t)+' ». Vérifiez l’orthographe.</p>';return}
      r.innerHTML='<p class="hint">'+all.length+(all.length>1?' cartes trouvées':' carte trouvée')+'</p><div class="grid" id="rg"></div><div id="more"></div>';
      more();
    },function(){
      r.innerHTML='<p class="hint">Impossible de joindre le service de cartes. Vérifiez votre connexion et réessayez.</p>';
    });
  }
  function more(){
    var from=shown,to=Math.min(all.length,from+PAGE),html='',idx=[];
    shown=to;
    for(var i=from;i<to;i++){
      var c=all[i];idx.push(i);
      html+='<article class="item">'+(c.image?'<img src="'+esc(imgOf(c))+'" alt="'+esc(c.name)+'" loading="lazy">':'<div class="noimg"></div>')+
        '<div><div class="nm">'+esc(c.name)+'</div><div class="st" id="rs'+i+'">n° '+esc(c.localId||'')+'</div></div>'+
        '<span class="price none" id="rp'+i+'" style="cursor:default">Prix…</span>'+
        '<button class="btn add" data-i="'+i+'" type="button">Ajouter à ma collection</button></article>';
    }
    $('#rg').insertAdjacentHTML('beforeend',html);
    $('#more').innerHTML=shown<all.length?'<button class="btn alt add" id="mb" type="button">Afficher plus ('+(all.length-shown)+')</button>':'';
    pool(idx,5,function(k){return detail(all[k].id).then(function(d){fill(k,d)})});
  }
  function fill(k,d){
    var s=$('#rs'+k),p=$('#rp'+k);if(!s||!p)return;
    if(d&&d.set&&d.set.name)s.textContent=d.set.name+' · n° '+(all[k].localId||'');
    var pr=price(d);
    p.textContent=pr?money(pr.v,pr.c):'Prix indisponible';
    p.className='price'+(pr?'':' none');
  }
  $('#go').onclick=search;
  $('#q').addEventListener('keydown',function(e){if(e.key==='Enter')search()});
  $('#res').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.id==='mb'){more();return}
    var c=all[+b.dataset.i];if(!c)return;
    b.disabled=true;
    detail(c.id).then(function(d){
      var p=price(d),f=col.find(function(x){return x.id===c.id});
      if(f)f.qty++;
      else col.push({id:c.id,name:c.name,set:d&&d.set&&d.set.name||'',num:c.localId||'',img:imgOf(c),price:p?p.v:null,cur:p?p.c:'EUR',qty:1});
      save();renderCol();toast(c.name+' ajoutée');b.disabled=false;
    });
  });

  renderCol();
})();
</script>
</body>
</html>
